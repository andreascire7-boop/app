# Render Blueprint — deploy backend + ai-engine + Postgres with one click,
# entirely from the Render dashboard (no credentials shared with anyone).
# See infra/DEPLOY.md for the full step-by-step, including the web-dashboard
# (deployed separately on Vercel, since it's a static/Next.js frontend).
databases:
  - name: sc-postgres
    databaseName: sc_platform
    user: sc_platform
    plan: free

services:
  - type: web
    name: sc-ai-engine
    runtime: docker
    dockerfilePath: ./ai-engine/Dockerfile
    dockerContext: ./ai-engine
    plan: free

  - type: web
    name: sc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Applies migrations and (idempotent) seed data before every start, since
    # this is a fresh managed Postgres instance with nothing in it yet.
    dockerCommand: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts && node dist/main.js"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sc-postgres
          property: connectionString
      - key: AI_ENGINE_BASE_URL
        # Render can't cross-reference another web service's public URL as a
        # ready-made "http://..." string in one blueprint pass — after the
        # first deploy, open sc-ai-engine, copy its onrender.com URL, paste it
        # here, then manually redeploy sc-backend. See infra/DEPLOY.md.
        value: "REPLACE_AFTER_FIRST_DEPLOY"
    healthCheckPath: /health
