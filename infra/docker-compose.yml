version: "3.9"

# Local dev stack (docs/product-design FASE 4). Not for production use.
services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: sc_platform
      POSTGRES_PASSWORD: sc_platform
      POSTGRES_DB: sc_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sc_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://sc_platform:sc_platform@postgres:5432/sc_platform?schema=public"
      REDIS_URL: "redis://redis:6379"
      AI_ENGINE_BASE_URL: "http://ai-engine:8000"
      PORT: 3000
    ports:
      - "3000:3000"

  ai-engine:
    build:
      context: ../ai-engine
    restart: unless-stopped
    environment:
      CORE_API_BASE_URL: "http://backend:3000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
